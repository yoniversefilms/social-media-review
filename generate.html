<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🎨</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>יצירת תמונות — סקירת תוכן</title>
<script>/* theme boot (dark mode 2026-08-02): stamp <html data-theme> BEFORE the
stylesheet loads so first paint is already themed. 'smr:theme' is written by
the nav toggle (ui.js); with nothing stored we follow the OS. */
try{var t=localStorage.getItem('smr:theme');
document.documentElement.dataset.theme=(t==='dark'||t==='light')?t:
(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}catch(e){}</script>
<link rel="stylesheet" href="css/app.css">
<style>
  /* page-specific styles for generate.html (owner: image-generation module).
     The module's own look (.gen-*) lives at the end of css/app.css on purpose —
     generate.js renders identically from any host page. */
  .page { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .page > h1 { margin: 12px 0 2px; font-size: 1.5rem; color: var(--accent); }
  .page > .sub { color: var(--ink-soft); font-size: .9rem; margin: 0 0 14px; }
</style>
</head>
<body>
<div id="nav"></div>
<div class="page">
  <h1>יצירת תמונות</h1>
  <p class="sub">איורים, תמונות וסגנונות ללוח — בלי לפתוח פוסט. מה שנוצר כאן נשמר בספריית הנכסים.</p>
  <div id="mount"></div>
</div>
<script src="config.js"></script>
<script type="module" src="js/generate-page.js"></script>
<script type="module" src="js/tours.js"></script>
</body>
</html>
