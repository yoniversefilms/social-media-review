<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🗳️</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>בניית פוסט — סקירת פוסטים</title>
<link rel="stylesheet" href="./css/app.css">
<style>
/* ── page-specific: builder ─────────────────────────────────────────── */
.b-wrap{max-width:1440px;margin:0 auto;padding:0 20px 56px}

/* top bar: title + caption + save */
.b-topbar{position:sticky;top:0;z-index:20;background:var(--bg);
  padding:14px 0 12px;border-bottom:1px solid var(--line);
  display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.b-topbar .field{margin:0}
.b-title{flex:0 1 320px;min-width:220px}
.b-caption{flex:1 1 380px;min-width:260px}
.b-caption textarea{min-height:52px;max-height:120px}
.b-savecol{display:flex;flex-direction:column;gap:6px;align-items:flex-start;
  padding-top:22px}
.b-note{font-size:.8rem;color:var(--ink-soft);max-width:230px;line-height:1.45}
.b-viewlink{font-weight:600;color:var(--accent)}

/* three columns; first DOM column sits on the RIGHT (RTL) */
.b-layout{display:grid;grid-template-columns:236px minmax(0,1fr) 340px;
  gap:22px;align-items:start;padding-top:18px}
@media (max-width:980px){.b-layout{grid-template-columns:1fr}}

/* right: the working carousel strip */
.b-strip{display:flex;flex-direction:column;gap:12px}
.b-thumb{position:relative;border:2px solid var(--line);border-radius:10px;
  overflow:hidden;cursor:pointer;background:var(--paper);padding:0}
.b-thumb.is-on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.b-thumb__mount{pointer-events:none}
.b-thumb__bar{display:flex;align-items:center;gap:2px;padding:4px 6px;
  border-top:1px solid var(--line);background:var(--paper)}
.b-thumb__n{font-size:.78rem;color:var(--ink-soft);margin-inline-end:auto;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.b-mini{appearance:none;border:none;background:none;cursor:pointer;
  font:inherit;font-size:.85rem;color:var(--ink-soft);padding:2px 5px;border-radius:6px}
.b-mini:hover{background:var(--line);color:var(--ink)}
.b-mini:disabled{opacity:.3;cursor:default}
.b-mini--x:hover{color:var(--no)}
.b-add{width:100%}

/* center: the live preview */
.b-stage{background:var(--paper);border:1px solid var(--line);border-radius:12px;
  padding:14px;min-height:300px}
.b-stage__mount{max-width:640px;margin:0 auto}
.b-empty{display:flex;flex-direction:column;align-items:center;gap:14px;
  padding:70px 20px;color:var(--ink-soft);text-align:center}

/* left: fields */
.b-fields{display:flex;flex-direction:column;gap:14px}
.b-fields .field{margin:0}
.b-fields__tpl{font-size:.8rem;color:var(--ink-soft)}
.b-illbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:start}
.b-illbtn img{width:44px;height:44px;flex:0 0 auto}

/* template picker + illustration picker grids (inside .modal) */
.b-pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:14px;max-height:min(58vh,620px);overflow-y:auto;padding:2px}
.b-pick{appearance:none;border:1px solid var(--line);border-radius:10px;
  background:var(--paper);cursor:pointer;padding:10px;font:inherit;color:var(--ink);
  display:flex;flex-direction:column;gap:8px;text-align:start}
.b-pick:hover{border-color:var(--accent)}
.b-pick img{width:100%;border-radius:6px;display:block;background:#fff}
.b-pick__name{font-weight:600;font-size:.88rem}
.b-pick__hint{font-size:.78rem;color:var(--ink-soft);line-height:1.4}
.b-illgrid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.b-illgrid .b-pick{align-items:center;text-align:center;padding:8px}
.b-illgrid .b-pick img{width:64px;height:64px;background:none}
.b-illgrid .b-pick__name{font-size:.72rem;font-weight:400;direction:ltr;
  overflow-wrap:anywhere}
.b-search{margin-bottom:12px}
</style>
</head>
<body>
<div id="nav"></div>
<div class="b-wrap">
  <div class="b-topbar" id="topbar">
    <div class="field b-title">
      <label class="field__label" for="b-title">שם הפוסט</label>
      <input class="field__input" id="b-title" type="text" maxlength="120"
             placeholder="למשל: ”הריב שחוזר“ — גרסה שלי">
    </div>
    <div class="field b-caption">
      <label class="field__label" for="b-caption">כיתוב לפוסט (הקפשן באינסטגרם)</label>
      <textarea id="b-caption" placeholder="הטקסט שילווה את הקרוסלה"></textarea>
    </div>
    <div class="b-savecol">
      <button class="btn btn--primary" id="b-save" type="button">שמור לסקירה</button>
      <span class="b-note">הפוסט יישמר לסקירת הצוות; רינדור סופי נעשה בסטודיו.</span>
      <span id="b-saved"></span>
    </div>
  </div>

  <div class="b-layout">
    <aside class="b-strip" id="strip" aria-label="שקופיות הקרוסלה"></aside>
    <section class="b-stage" id="stage" aria-label="תצוגה מקדימה"></section>
    <aside class="b-fields" id="fields" aria-label="תוכן השקופית"></aside>
  </div>
</div>
<script src="./config.js"></script>
<script type="module" src="./js/build.js"></script>
</body>
</html>
