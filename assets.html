<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🗂️</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>נכסים — סקירת תוכן</title>
<script>/* theme boot (dark mode 2026-08-02): stamp <html data-theme> BEFORE the
stylesheet loads so first paint is already themed. 'smr:theme' is written by
the nav toggle (ui.js); with nothing stored we follow the OS. */
try{var t=localStorage.getItem('smr:theme');
document.documentElement.dataset.theme=(t==='dark'||t==='light')?t:
(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}catch(e){}</script>
<link rel="stylesheet" href="css/app.css">
<style>
  /* page-specific styles for assets.html (owner: asset library) */
  .page { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .page > h1 { margin: 12px 0 2px; font-size: 1.5rem; color: var(--accent); }
  .page > .sub { color: var(--ink-soft); font-size: .9rem; margin: 0 0 14px; }

  .a-toolbar { display: flex; flex-direction: column; gap: 10px; margin: 0 0 16px; }
  .a-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .a-row .field__input { flex: 1; min-width: 200px; max-width: 420px; }
  .a-count { color: var(--ink-soft); font-size: .88rem; }

  /* upload dock — same affordance as the post page's תמונות tab */
  .a-drop {
    border: 2px dashed var(--line); border-radius: var(--radius);
    background: var(--paper); padding: 18px; text-align: center; cursor: pointer;
    color: var(--ink-soft); font-size: .92rem;
  }
  .a-drop.over { border-color: var(--accent); color: var(--ink); }
  .a-drop b { color: var(--ink); }
  .a-drop select {
    min-height: 36px; padding: 4px 10px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--bg); color: var(--ink);
    font-family: inherit; font-size: .9rem;
  }

  /* folder-upload progress (spec 10 §A). Lives INSIDE the dock so it cannot be
     missed, and stays a single line: «12/68 הועלו». */
  .a-prog {
    margin-top: 8px; font-size: .84rem; color: var(--ink);
    direction: rtl; unicode-bidi: isolate;
  }
  .a-prog[hidden] { display: none; }
  .a-drop .btn { min-height: 36px; padding: 4px 12px; font-size: .9rem; }

  .a-grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  }
  .a-card {
    background: var(--paper); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
    overflow: hidden; display: flex; flex-direction: column;
  }
  .a-thumb {
    position: relative; height: 130px; background: var(--bg);
    display: flex; align-items: center; justify-content: center; cursor: zoom-in;
    border-bottom: 1px solid var(--line);
  }
  .a-thumb img { max-width: 100%; max-height: 100%; }
  .a-thumb--cover img { width: 100%; height: 100%; object-fit: cover; }
  /* Studio drawings are monochrome `stroke="currentColor"`. Loaded through <img>
     they render in the SVG's OWN document, where currentColor falls back to black —
     so the `color` here never reached them and the whole library drew black, with
     .13 washes turning into grey slabs. Painting the drawing as a MASK over a
     coloured box makes it take this element's colour for real: strokes become solid
     ink, and a wash's alpha becomes a soft tint, which is how it looks on a slide. */
  .a-thumb--vec { color: var(--accent); padding: 12px; }
  .a-thumb--vec .a-vec {
    width: 100%; height: 100%; background-color: currentColor;
    -webkit-mask: var(--vec) center / contain no-repeat;
    mask: var(--vec) center / contain no-repeat;
  }
  .a-badge {
    position: absolute; inset-block-start: 6px; inset-inline-start: 6px;
    background: var(--accent); color: var(--solid-ink); border-radius: 999px;
    font-size: .64rem; line-height: 1; padding: 4px 7px;
  }
  /* multi-select tick (spec 10 §D-1). Sits opposite the «מפוסט» badge so the
     two never overlap, and carries its own plate — a bare checkbox over a
     photo is invisible on light images. */
  .a-pick {
    position: absolute; inset-block-start: 6px; inset-inline-end: 6px;
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 8px; padding: 3px 4px; line-height: 0; cursor: pointer;
  }
  .a-pick--on { border-color: var(--accent); background: var(--accent); }
  .a-pick input { width: 16px; height: 16px; margin: 0; cursor: pointer; accent-color: var(--accent); }
  .a-pick--on input { accent-color: var(--solid-ink); }

  .a-meta { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 4px; }
  .a-name {
    font-weight: 700; font-size: .88rem; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  /* The meta line mixes Hebrew ("איור") with Latin runs ("240×240", "12KB")
     separated by bidi-NEUTRAL dots. Left alone the runs reorder and the line
     reads as gibberish (seen in the first render). The line stays RTL and
     each Latin run is isolated instead. */
  .a-sub { color: var(--ink-soft); font-size: .74rem; }
  .a-sub .ltr { unicode-bidi: isolate; direction: ltr; }
  .a-name { direction: rtl; }
  .a-tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .a-tags .tag { font-size: .66rem; }
  .a-used { font-size: .72rem; color: var(--ink-soft); }
  .a-used b { color: var(--ink); }
  /* .btn--ghost is borderless by design (it is used inside toolbars). At card
     scale that reads as loose text, not as actions — give these a hairline so
     they look like the buttons they are. */
  .a-acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .a-acts .btn {
    min-height: 0; padding: 4px 9px; font-size: .74rem;
    border-color: var(--line); color: var(--ink-soft);
  }
  .a-acts .btn:hover { border-color: var(--accent); color: var(--accent); }

  .empty { color: var(--ink-soft); font-size: .95rem; padding: 24px 8px; text-align: center; }
  .empty b { color: var(--ink); }
</style>
</head>
<body>
<div id="nav"></div>
<div class="page">
  <h1>נכסים</h1>
  <p class="sub">כל התמונות, הלוגו, האיורים וחותמות המותג של הלוח — במקום אחד, בענן. מה שמעלים כאן זמין מיד בכל הפוסטים.</p>
  <div id="toolbar" class="a-toolbar"></div>
  <main id="grid"><p class="empty">טוען…</p></main>
</div>
<script src="config.js"></script>
<script type="module" src="js/assets.js"></script>
</body>
</html>
