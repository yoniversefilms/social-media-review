<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🗂️</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>נכסים — סקירת תוכן</title>
<script>/* theme boot (dark mode 2026-08-02): stamp <html data-theme> BEFORE the
stylesheet loads so first paint is already themed. 'smr:theme' is written by
the nav toggle (ui.js); with nothing stored we follow the OS. */
try{var t=localStorage.getItem('smr:theme');
document.documentElement.dataset.theme=(t==='dark'||t==='light')?t:
(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}catch(e){}</script>
<link rel="stylesheet" href="css/app.css">
<style>
  /* page-specific styles for assets.html (owner: asset library) */
  .page { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .page > h1 { margin: 12px 0 2px; font-size: 1.5rem; color: var(--accent); }
  .page > .sub { color: var(--ink-soft); font-size: .9rem; margin: 0 0 14px; }

  .a-toolbar { display: flex; flex-direction: column; gap: 10px; margin: 0 0 16px; }
  .a-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .a-row .field__input { flex: 1; min-width: 200px; max-width: 420px; }
  .a-count { color: var(--ink-soft); font-size: .88rem; }

  /* upload dock — same affordance as the post page's תמונות tab */
  .a-drop {
    border: 2px dashed var(--line); border-radius: var(--radius);
    background: var(--paper); padding: 18px; text-align: center; cursor: pointer;
    color: var(--ink-soft); font-size: .92rem;
  }
  .a-drop.over { border-color: var(--accent); color: var(--ink); }
  .a-drop b { color: var(--ink); }
  .a-drop select {
    min-height: 36px; padding: 4px 10px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--bg); color: var(--ink);
    font-family: inherit; font-size: .9rem;
  }

  /* The spec-10 `.a-prog` line lived here until v2.8 replaced it with the
     shared ui.js upload bar (.upbar, css/app.css). Removed in v2.9 — the v2.8
     allowlist could not reach this file, and dead CSS that names a class no
     module renders is the kind of thing the next reader trusts. */
  .a-drop .btn { min-height: 36px; padding: 4px 12px; font-size: .9rem; }

  /* v2.6 — the dock's control row. flex + wrap rather than inline text nodes:
     with two <select>s and a button the old `kindSel + ' ' + pickDir` line
     broke mid-control on a narrow window, and the gap between an RTL <select>
     and the next control was a bidi-neutral space that moved with the text. */
  .a-dockctl {
    margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px;
    align-items: center; justify-content: center;
  }
  .a-dockctl select { max-width: 100%; }

  /* v2.9 — the dock's destination line. Louder than .a-sub because it is the
     one thing in the dock that changes as you walk around, and a batch landing
     in the wrong folder is the mistake this line exists to prevent. */
  .a-dest { margin-top: 6px; font-size: .88rem; color: var(--ink); }
  .a-dest b { color: var(--accent); }
  /* The path is a mixed-script run — see the .a-fold__b note below for the
     measurement. Same treatment, same reason. */
  .a-dest bdi { unicode-bidi: isolate; direction: ltr; }

  /* v2.9 — the breadcrumb. It replaced the v2.6 chip rail: chips FILTER, and
     what this page needed was a place you are standing IN. The row is the
     document's own RTL, so «הספרייה» sits at the right and each '‹' steps
     leftward — the direction a Hebrew reader travels. Verified in a browser. */
  .a-crumbs { gap: 4px; row-gap: 6px; }
  .a-crumb {
    font: inherit; font-size: .88rem; cursor: pointer;
    background: none; border: 0; padding: 2px 4px; border-radius: 8px;
    color: var(--accent); max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .a-crumb:hover { background: var(--paper); }
  /* Where we ARE is not a link. Same size, no colour, no pointer — otherwise
     the last crumb invites a click that does nothing. */
  .a-crumb--cur { color: var(--ink); font-weight: 700; cursor: default; }
  .a-crumb--cur:hover { background: none; }
  .a-crumb__sep { color: var(--ink-soft); font-size: .8rem; }
  .a-newfolder {
    min-height: 0; padding: 3px 10px; font-size: .8rem;
    border-color: var(--line); color: var(--ink-soft); margin-inline-start: 8px;
  }
  .a-newfolder:hover { border-color: var(--accent); color: var(--accent); }

  /* v2.9 — folder tiles. They sit ABOVE the cards because a folder is the
     bigger object: looking for «צילומי ספטמבר» must not mean scrolling past
     forty loose photos. Deliberately NOT the same grid as .a-grid — a tile is
     a row of text, not a thumbnail, and matching the card width would make an
     empty folder look like a broken image. */
  .a-tiles {
    display: grid; gap: 8px; margin: 0 0 14px;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  }
  .a-tile {
    font: inherit; text-align: start; cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    background: var(--paper); color: var(--ink);
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px 12px; min-height: 44px;
  }
  .a-tile:hover { border-color: var(--accent); }
  .a-tile__ico { font-size: 1.1rem; line-height: 1; flex: none; }
  .a-tile__name {
    flex: 1; font-weight: 600; font-size: .9rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* A folder NAME is a single segment, so it needs isolation but not an LTR
     base — «day1» inside a Hebrew row must not drag the count across it. */
  .a-tile__name bdi { unicode-bidi: isolate; }
  /* The count is a Latin run in a Hebrew row: without isolation "3" and the
     name swap sides on a name that starts with a Latin letter. */
  .a-tile__n {
    flex: none; color: var(--ink-soft); font-size: .8rem;
    unicode-bidi: isolate; direction: ltr;
  }
  .a-tile--none { border-style: dashed; }
  /* Created but not persisted — migration 029 is not applied on this board.
     Dashed and faded so it does not read as an equal to a real folder. */
  .a-tile--ghost { opacity: .62; border-style: dashed; }

  .a-ferr { color: var(--no); font-size: .85rem; margin: 6px 0 0; }
  .a-ferr[hidden] { display: none; }

  /* v2.9 — the drill-in picker inside the move dialog. Same tree, same
     breadcrumb component, one level of children at a time: a flat <select> is
     fine at six folders and unreadable at forty, and it cannot express "into a
     NEW folder inside this one" at all. */
  .a-picker { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .a-crumbs--pick { padding: 8px 10px; background: var(--paper); border-bottom: 1px solid var(--line); }
  .a-picker__list { max-height: 240px; overflow-y: auto; padding: 6px; }
  .a-picker__row {
    font: inherit; width: 100%; text-align: start; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: none; border: 0; border-radius: 8px; padding: 8px 10px;
    color: var(--ink); font-size: .9rem;
  }
  .a-picker__row:hover { background: var(--paper); }
  .a-picker__row bdi { unicode-bidi: isolate; }
  .a-picker__go { color: var(--ink-soft); }
  .a-picker__foot {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    flex-wrap: wrap; padding: 8px 10px; border-top: 1px solid var(--line);
    background: var(--paper);
  }
  .a-picker__dest { font-size: .85rem; color: var(--ink-soft); }
  .a-picker__dest b { color: var(--ink); }
  .a-picker__dest bdi { unicode-bidi: isolate; direction: ltr; }

  /* v2.9 — the one destructive action on this page, and the only one that gets
     a colour. Ghost until hovered, so a card's action row does not read as a
     row of warnings. */
  .a-danger:hover { border-color: var(--no); color: var(--no); }

  /* the folder chip on a card */
  .a-fold { display: flex; }
  .a-fold__b {
    font: inherit; font-size: .7rem; cursor: pointer;
    background: var(--bg); color: var(--ink-soft);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 2px 8px; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .a-fold__b:hover { border-color: var(--accent); color: var(--accent); }
  /* A folder PATH is a mixed-script run: «קמפיין/shoot/day1» in an RTL context
     lays out visually as «shoot/day1/קמפיין», which names the wrong parent.
     Measured, not guessed. Same treatment the meta line already gives its Latin
     runs (.a-sub .ltr): isolate the run and give it an LTR base, so the segments
     stay in path order. A wholly-Hebrew folder name is a single run and renders
     identically either way. */
  .a-fold__b bdi { unicode-bidi: isolate; direction: ltr; }

  .a-grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  }
  .a-card {
    background: var(--paper); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
    overflow: hidden; display: flex; flex-direction: column;
  }
  .a-thumb {
    position: relative; height: 130px; background: var(--bg);
    display: flex; align-items: center; justify-content: center; cursor: zoom-in;
    border-bottom: 1px solid var(--line);
  }
  .a-thumb img { max-width: 100%; max-height: 100%; }
  .a-thumb--cover img { width: 100%; height: 100%; object-fit: cover; }
  /* Studio drawings are monochrome `stroke="currentColor"`. Loaded through <img>
     they render in the SVG's OWN document, where currentColor falls back to black —
     so the `color` here never reached them and the whole library drew black, with
     .13 washes turning into grey slabs. Painting the drawing as a MASK over a
     coloured box makes it take this element's colour for real: strokes become solid
     ink, and a wash's alpha becomes a soft tint, which is how it looks on a slide. */
  .a-thumb--vec { color: var(--accent); padding: 12px; }
  .a-thumb--vec .a-vec {
    width: 100%; height: 100%; background-color: currentColor;
    -webkit-mask: var(--vec) center / contain no-repeat;
    mask: var(--vec) center / contain no-repeat;
  }
  .a-badge {
    position: absolute; inset-block-start: 6px; inset-inline-start: 6px;
    background: var(--accent); color: var(--solid-ink); border-radius: 999px;
    font-size: .64rem; line-height: 1; padding: 4px 7px;
  }
  /* multi-select tick (spec 10 §D-1). Sits opposite the «מפוסט» badge so the
     two never overlap, and carries its own plate — a bare checkbox over a
     photo is invisible on light images. */
  .a-pick {
    position: absolute; inset-block-start: 6px; inset-inline-end: 6px;
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 8px; padding: 3px 4px; line-height: 0; cursor: pointer;
  }
  .a-pick--on { border-color: var(--accent); background: var(--accent); }
  .a-pick input { width: 16px; height: 16px; margin: 0; cursor: pointer; accent-color: var(--accent); }
  .a-pick--on input { accent-color: var(--solid-ink); }

  .a-meta { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 4px; }
  .a-name {
    font-weight: 700; font-size: .88rem; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  /* The meta line mixes Hebrew ("איור") with Latin runs ("240×240", "12KB")
     separated by bidi-NEUTRAL dots. Left alone the runs reorder and the line
     reads as gibberish (seen in the first render). The line stays RTL and
     each Latin run is isolated instead. */
  .a-sub { color: var(--ink-soft); font-size: .74rem; }
  .a-sub .ltr { unicode-bidi: isolate; direction: ltr; }
  .a-name { direction: rtl; }
  .a-tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .a-tags .tag { font-size: .66rem; }
  .a-used { font-size: .72rem; color: var(--ink-soft); }
  .a-used b { color: var(--ink); }
  /* .btn--ghost is borderless by design (it is used inside toolbars). At card
     scale that reads as loose text, not as actions — give these a hairline so
     they look like the buttons they are. */
  .a-acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .a-acts .btn {
    min-height: 0; padding: 4px 9px; font-size: .74rem;
    border-color: var(--line); color: var(--ink-soft);
  }
  .a-acts .btn:hover { border-color: var(--accent); color: var(--accent); }

  .empty { color: var(--ink-soft); font-size: .95rem; padding: 24px 8px; text-align: center; }
  .empty b { color: var(--ink); }

  /* ?embed=1 — hosted inside the post page's «ספרייה» tab: hide the page
     chrome, keep everything else identical (assets.js adds the class). */
  .a-embed #nav { display: none; }
  .a-embed .page > h1, .a-embed .page > .sub { display: none; }
  .a-embed .page { padding-top: 6px; }
</style>
</head>
<body>
<div id="nav"></div>
<div class="page">
  <h1>נכסים</h1>
  <p class="sub">כל התמונות, הלוגו, האיורים וחותמות המותג של הלוח — במקום אחד, בענן. מה שמעלים כאן זמין מיד בכל הפוסטים.</p>
  <div id="toolbar" class="a-toolbar"></div>
  <main id="grid"><p class="empty">טוען…</p></main>
</div>
<script src="config.js"></script>
<script type="module" src="js/assets.js"></script>
<script type="module" src="js/tours.js"></script>
</body>
</html>
