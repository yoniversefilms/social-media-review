<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>סקירת פוסטים — הלוח</title>
<link rel="icon" href="data:,">
<script>/* theme boot (dark mode 2026-08-02): stamp <html data-theme> BEFORE the
stylesheet loads so first paint is already themed. 'smr:theme' is written by
the nav toggle (ui.js); with nothing stored we follow the OS. */
try{var t=localStorage.getItem('smr:theme');
document.documentElement.dataset.theme=(t==='dark'||t==='light')?t:
(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}catch(e){}</script>
<link rel="stylesheet" href="./css/app.css">
<style>
/* ── page-specific: gallery ─────────────────────────────────────────── */
.g-wrap{max-width:1280px;margin:0 auto;padding:0 20px 56px}

/* toolbar */
.g-toolbar{position:sticky;top:0;z-index:20;background:var(--bg);
  padding:14px 0 10px;display:flex;flex-direction:column;gap:10px;
  border-bottom:1px solid var(--line)}
/* fold (v2.8): scrolling down collapses the whole filter block to the one
   strip below; scroll up or a tap restores it. index.js wireToolbarFold()
   drives the class. The nav above scrolls away with the page as it always
   has (its sticky is inert — it sits in a #nav wrapper its own height, and
   sticky cannot travel past its parent), so top:0 is the true top. */
.g-tbfold{display:none;align-items:center;gap:8px;width:100%;
  appearance:none;border:none;background:none;cursor:pointer;font:inherit;
  color:var(--ink-soft);padding:2px 0 4px;min-height:32px}
.g-tbfold:hover{color:var(--ink)}
.g-tbfold__ico{font-size:1rem;line-height:1}
.g-tbfold__n{opacity:.7;font-size:.85em}
.g-toolbar.is-folded{padding:2px 0}
.g-toolbar.is-folded > :not(.g-tbfold){display:none}
.g-toolbar.is-folded .g-tbfold{display:flex}
.g-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.g-chips{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.g-chip-n{opacity:.65;font-size:.82em;margin-inline-start:4px}
.g-tabs{display:flex;gap:2px;flex-wrap:wrap}
.g-tab{appearance:none;background:none;border:none;cursor:pointer;
  font:inherit;color:var(--ink-soft);padding:6px 12px 8px;
  border-bottom:2px solid transparent;white-space:nowrap}
.g-tab:hover{color:var(--ink)}
.g-tab.is-on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
/* «ממתינים לאישור שיווק» toggle (v2.3, plan §7) — lives beside the stage
   tabs but is a toggle, not a lane, so it earns its own warning color even
   before it's picked. Declared after .g-tab.is-on so it wins the tie. */
.g-tab--wait{color:var(--no)}
.g-tab--wait:hover{color:var(--no)}
.g-tab--wait.is-on{color:var(--solid-ink);background:var(--no);border-bottom-color:var(--no);
  border-radius:8px 8px 0 0}
.g-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-inline-start:auto}
.g-search{padding:7px 12px;border:1px solid var(--line);border-radius:999px;
  background:var(--paper);color:var(--ink);font:inherit;min-width:180px}
.g-search:focus{outline:2px solid var(--accent);outline-offset:1px}
.g-sort{padding:7px 10px;border:1px solid var(--line);border-radius:10px;
  background:var(--paper);color:var(--ink);font:inherit;cursor:pointer}
.g-arrange{padding:7px 12px;border:1px solid var(--line);border-radius:999px;
  background:var(--paper);color:var(--ink);font:inherit;cursor:pointer;
  white-space:nowrap}
.g-arrange:hover{border-color:var(--accent)}
.g-arrange.is-on{background:var(--accent);border-color:var(--accent);color:var(--solid-ink)}

/* progress strip */
.g-progress{display:flex;align-items:center;gap:12px;padding:14px 2px 4px}
.g-progress__txt{font-size:.92rem;color:var(--ink-soft);white-space:nowrap}
.g-progress__txt b{color:var(--ink)}
.g-progress__track{flex:1;height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.g-progress__fill{height:100%;border-radius:999px;background:var(--accent);
  transition:width .4s ease;min-width:0}
.g-progress__fill.is-done{background:var(--yes)}

/* grid */
.g-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(264px,1fr));
  gap:16px;padding-top:16px}

/* card */
.g-card{position:relative;display:flex;flex-direction:column;gap:8px;
  padding:10px;transition:box-shadow .15s ease, transform .15s ease}
.g-card:hover{box-shadow:0 6px 20px rgba(36,29,32,.10);transform:translateY(-2px)}
.g-card--mine-yes{border-inline-start:4px solid var(--yes)}
.g-card--mine-no{border-inline-start:4px solid var(--no)}
.g-card--mine-maybe{border-inline-start:4px solid var(--maybe)}
.g-cover{position:relative;aspect-ratio:4/5;border-radius:12px;overflow:hidden;
  background:linear-gradient(160deg,var(--ph-a),var(--ph-b))}
.g-cover img{width:100%;height:100%;object-fit:cover;display:block}
.g-cover__ph{position:absolute;inset:0;display:none;align-items:center;
  justify-content:center;font-size:2rem;color:var(--ink-soft);
  background:linear-gradient(160deg,var(--ph-a),var(--ph-b))}
.g-cover.is-broken img{display:none}
.g-cover.is-broken .g-cover__ph{display:flex}
.g-title{font-weight:600;line-height:1.35;color:var(--ink);text-decoration:none;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;min-height:2.7em}
/* stretched link: the title anchor covers the whole card */
.g-title::after{content:"";position:absolute;inset:0;z-index:1;border-radius:inherit}
.g-tags{display:flex;gap:6px;flex-wrap:wrap;font-size:.78rem}
.g-meta{display:flex;align-items:center;gap:10px;font-size:.85rem;
  color:var(--ink-soft);flex-wrap:wrap}
.g-meta__votes{display:flex;gap:8px}
.g-meta__votes .is-zero{opacity:.4}
.g-when{margin-inline-start:auto;font-size:.78rem;opacity:.7;white-space:nowrap}

/* arrange mode (unlocked manual order) */
.g-grid.is-arranging .g-card{cursor:grab;user-select:none;touch-action:none;
  outline:2px dashed var(--line);outline-offset:2px}
.g-grid.is-arranging .g-card:hover{transform:none}
.g-card.is-dragging{opacity:.88;transform:rotate(2deg) scale(1.04)!important;
  box-shadow:0 14px 34px rgba(36,29,32,.28);z-index:5;cursor:grabbing}

/* live-composed cover (edited posts only) — the composed slide 0 lies over
   the rendered PNG, which stays underneath as the placeholder until it lands */
.g-live{position:absolute;inset:0;overflow:hidden}
.g-live iframe{border:0}
/* once the compose has landed the stale PNG must not show through */
.g-cover.is-live img{visibility:hidden}
.g-cover--edited::after{content:"";position:absolute;top:8px;inset-inline-start:8px;
  z-index:2;width:8px;height:8px;border-radius:999px;background:var(--accent);
  box-shadow:0 0 0 2px var(--paper)}

/* version badge + dropdown */
.g-ver{position:relative;z-index:2;appearance:none;border:none;font:inherit;
  font-size:.8rem;font-weight:600;cursor:pointer;
  background:var(--wash-2);color:var(--ink-soft)}
.g-ver:hover{background:var(--wash-2);color:var(--ink)}
/* :hover outranks a plain class — the previewing state must still win */
.g-ver--past,.g-ver--past:hover{background:var(--accent);color:var(--solid-ink)}
.g-ver__n{direction:ltr}
.g-ver__caret{font-size:.7em;opacity:.75}
/* Anchored to the badge (bottom of the card), not to the ⋯ button. The
   compound selector is deliberate: .g-pop is declared further down and would
   otherwise win on source order and re-pin the list to top:50px. */
.g-pop.g-verlist{top:auto;bottom:68px;min-width:210px;
  max-height:min(320px,52vh);overflow:auto;gap:2px}
.g-verlist__item{display:flex;flex-direction:column;align-items:flex-start;gap:1px;
  appearance:none;border:none;background:none;font:inherit;cursor:pointer;
  text-align:start;width:100%;padding:6px 8px;border-radius:8px;color:var(--ink)}
.g-verlist__item:hover{background:var(--wash-2)}
.g-verlist__item.is-on{background:var(--accent);color:var(--solid-ink)}
.g-verlist__item b{direction:ltr;unicode-bidi:plaintext;font-size:.9rem}
.g-verlist__meta{font-size:.72rem;opacity:.72}

/* “viewing an older version” hint, pinned inside the cover */
.g-verhint{position:absolute;inset-inline:8px;bottom:8px;z-index:2;
  display:flex;align-items:center;gap:8px;justify-content:space-between;
  padding:5px 9px;border-radius:10px;font-size:.74rem;
  background:color-mix(in srgb, var(--ink) 85%, transparent);color:var(--bg)}
.g-verhint__reset{appearance:none;border:none;background:color-mix(in srgb, var(--bg) 25%, transparent);
  color:var(--bg);font:inherit;font-size:.72rem;padding:2px 8px;border-radius:999px;
  cursor:pointer;white-space:nowrap}
.g-verhint__reset:hover{background:color-mix(in srgb, var(--bg) 40%, transparent)}

/* waiting-view reason badge (v2.3, plan §7) — shown ONLY while the
   «ממתינים לאישור שיווק» toggle is on; every card there is none/stale/revoked
   by construction, so exactly one of these ever appears. */
.tag--wait{font-weight:600}
.tag--wait-none,.tag--wait-revoked{
  background:color-mix(in srgb, var(--no) 16%, transparent);
  color:color-mix(in srgb, var(--no) 72%, var(--ink))}
.tag--wait-stale{
  background:color-mix(in srgb, var(--maybe) 16%, transparent);
  color:color-mix(in srgb, var(--maybe) 72%, var(--ink))}

/* per-card overflow menu */
.g-menu-btn{position:absolute;top:16px;inset-inline-end:16px;z-index:2;
  width:30px;height:30px;border-radius:999px;border:none;cursor:pointer;
  background:color-mix(in srgb, var(--paper) 92%, transparent);color:var(--ink);font-size:1.1rem;
  line-height:1;display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 4px rgba(36,29,32,.18)}
.g-menu-btn:hover{background:var(--paper)}
.g-pop{position:absolute;top:50px;inset-inline-end:16px;z-index:3;
  background:var(--paper);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 8px 24px rgba(36,29,32,.16);padding:10px;min-width:170px;
  display:flex;flex-direction:column;gap:6px}
.g-pop label{font-size:.8rem;color:var(--ink-soft)}
.g-pop select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);color:var(--ink);font:inherit;cursor:pointer;width:100%}

/* empty state */
.g-empty{grid-column:1/-1;text-align:center;padding:64px 16px;color:var(--ink-soft)}
.g-empty p{margin:0 0 16px;font-size:1.05rem}

/* skeleton */
@keyframes g-shimmer{0%{background-position:150% 0}100%{background-position:-50% 0}}
.g-skel{pointer-events:none}
.g-skel .g-cover,.g-skel .g-sk-line{
  background:linear-gradient(100deg,var(--ph-a) 40%,var(--ph-b) 50%,var(--ph-a) 60%);
  background-size:200% 100%;animation:g-shimmer 1.3s infinite linear}
.g-sk-line{height:14px;border-radius:6px}
.g-sk-line--short{width:60%}

@media (max-width:520px){
  .g-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .g-search{min-width:120px;flex:1}
  .g-tools{margin-inline-start:0;width:100%}
}
</style>
</head>
<body>
<div class="g-wrap">
  <div id="nav"></div>

  <header class="g-toolbar toolbar" id="toolbar" hidden>
    <div class="g-row">
      <div class="g-chips" id="cat-chips"></div>
      <div class="g-tools">
        <input class="g-search" id="search" type="search"
               placeholder="חיפוש בכותרת או בקפשן…" autocomplete="off">
        <select class="g-sort" id="sort" aria-label="מיון">
          <option value="manual" selected>סידור ידני</option>
          <option value="activity">פעילות אחרונה</option>
          <option value="rated">הכי מדורג</option>
          <option value="new">חדש ביותר</option>
          <option value="yes">הכי הרבה 👍</option>
          <option value="no">הכי הרבה 👎</option>
          <option value="talk">הכי מדובר</option>
          <option value="unvoted">טרם הצבעתי</option>
        </select>
        <button class="g-arrange" id="arrange" type="button" hidden>🔓 סידור חופשי</button>
      </div>
    </div>
    <div class="g-tabs" id="stage-tabs" role="tablist"></div>
    <!-- author shelf (v2.5, spec 08): "their" shelf per therapist. Rendered
         only when the board has posts carrying an author — a factory-only
         board never grows an empty row of chips. Styles: css/app.css §v2.5. -->
    <div class="g-authors" id="author-shelf" hidden></div>
  </header>

  <section class="g-progress" id="progress" hidden></section>

  <main class="g-grid" id="grid" aria-live="polite"></main>
</div>

<noscript><p style="text-align:center;padding:40px">הכלי דורש JavaScript.</p></noscript>
<script src="./config.js"></script>
<script type="module" src="./js/index.js"></script>
<script type="module" src="./js/tours.js"></script>
</body>
</html>
